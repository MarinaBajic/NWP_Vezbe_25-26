<div class="card" [ngClass]="productClasses">
  <img [src]="product().imageUrl" class="card-img-top" [alt]="product().name" />
  <div class="card-body d-flex flex-column gap-2 align-items-center">
    <h2 class="card-title">{{ product().name }}</h2>
    <p [ngStyle]="productStyles">{{ product().price | currency: 'EUR' }}</p>
    <div class="d-flex align-items-center gap-2">
      @if (canDecreaseQuantity()) {
        <button class="btn btn-outline-dark" (click)="decreaseQuantity()">-</button>
      }
      <span>{{ product().quantityInCart }}</span>
      <button class="btn btn-outline-dark" (click)="increaseQuantity()">+</button>
    </div>
    <ng-content></ng-content>
  </div>
</div>
