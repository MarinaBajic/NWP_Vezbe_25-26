<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Bootstrap primer</title>

		<style>
			[class*="col"] {
				background-color: #33b5e5;
				border: 2px solid #fff;
				padding: 1rem;
				color: #fff;
			}
			.child {
				background-color: #2041d3;
			}
		</style>
	</head>
	<body>
		<h1 class="text-center">Bootstrap Grid</h1>

		<div class="container mb-3">
			<div class="row">
				<div class="col">Column 1</div>
				<div class="col">Column 2</div>
			</div>
		</div>

		<div class="container border border-2 border-success mb-3">
			<div class="row">
				<div class="col">Column 1</div>
				<div class="col">Column 2</div>
				<div class="col">Column 3</div>
			</div>
		</div>

		<div class="container border border-2 border-success mb-3">
			<div class="row">
				<div class="col-4">Column 1</div>
				<div class="col-4">Column 2</div>
				<div class="col-4">Column 3</div>
			</div>
		</div>

		<div class="container border border-2 border-success mb-5">
			<div class="row text-center">
				<div class="col-2">1</div>
				<div class="col-2">2</div>
			</div>
		</div>

		<h2 class="display-3 text-center mb-3">Gutters</h2>

		<div class="container border border-2 border-success my-5">
			<div class="row">
				<div class="col-6">
					<div class="child">1</div>
				</div>
				<div class="col-6">
					<div class="child">2</div>
				</div>
				<div class="col-6">
					<div class="child">3</div>
				</div>
				<div class="col-6">
					<div class="child">4</div>
				</div>
			</div>
		</div>
	</body>
</html>
