<div class="d-flex gap-3 justify-content-center my-4">
  @for (product of products; track product.id; let i = $index) {
    <app-product [product]="product" (changeQuantityEvent)="changeQuantity($event)" />
  }
</div>
<p>There are in total {{ sumProductsInCart }} products in your cart.</p>
<p>Final price to pay: {{ totalPrice | currency: 'EUR' }}</p>
